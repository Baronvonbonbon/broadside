packages:
  - "packages/*"
  - "apps/*"
  - "services/*"
  - "contracts"

# pnpm blocks dependency install scripts by default, which is the right default
# — an install script is arbitrary code from a transitive dependency. esbuild is
# allowed by name because vite cannot run without it: its script links the
# platform-native binary, and without that the bundler is a no-op that fails at
# first build. Anything added here should need the same kind of justification.
allowBuilds:
  esbuild: true
  # Both are hardhat's crypto path and both compile native bindings for speed.
  # Each also ships a pure-JS fallback, so the honest reason to allow them is
  # test-suite runtime rather than necessity — DATUM's ~2,080 cases hash a great
  # deal. They are long-standing, widely-audited packages in the Ethereum
  # toolchain, which is the bar anything added here should clear.
  keccak: true
  secp256k1: true
